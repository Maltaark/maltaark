  --font:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{overflow-x:hidden}
body{background:var(--black);color:var(--white);font-family:var(--font);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-x:clip;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--black)}
h1,h2,h3,p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--lamp);outline-offset:3px;border-radius:8px}
.cond{font-stretch:62%;font-weight:800;text-transform:uppercase;letter-spacing:-.005em;line-height:.9;text-wrap:balance}
.wide{font-stretch:125%;font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.wrap{width:100%;max-width:720px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* top capsule */
.top{position:fixed;left:0;right:0;top:0;z-index:80;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.cap{position:relative;display:flex;align-items:center;gap:14px;width:min(100%,420px);margin:0 auto;padding:8px 16px 8px 14px;border-radius:999px;background:rgba(8,8,8,.92);box-shadow:inset 0 0 0 1px #262626,0 14px 40px -18px #000;overflow:hidden}
.cap::before{content:"";position:absolute;top:0;left:-30%;width:30%;height:1px;background:linear-gradient(90deg,transparent,var(--lamp),transparent);animation:scan 4.5s ease-in-out infinite}
@keyframes scan{0%{transform:translateX(0)}60%,100%{transform:translateX(460%)}}
.cap img{display:block;width:36px;height:auto;flex:0 0 auto}
.track{position:relative;flex:1;height:2px;border-radius:2px;background:#222}
.track b{position:absolute;inset:0;border-radius:2px;background:linear-gradient(90deg,#8a6a1c,var(--lamp));transform-origin:left;transform:scaleX(0);transition:transform .9s var(--ease)}
.track i{position:absolute;left:0;top:-3px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px rgba(255,203,69,.85);transition:transform .9s var(--ease)}
.cap-n{flex:0 0 auto;font-size:13px;font-weight:700;color:var(--warm);font-variant-numeric:tabular-nums}

main{padding-top:calc(96px + env(safe-area-inset-top,0px));padding-bottom:80px}

/* intro */
.intro{position:relative;text-align:left;padding-top:140px}
.lamp{position:absolute;left:50%;top:-96px;width:0;height:0;transform-origin:0 0;animation:swing 6s ease-in-out infinite}
.lamp .cord{position:absolute;left:-1px;top:0;width:2px;height:120px;background:#2a2a2a}
.lamp .shade{position:absolute;left:-46px;top:118px;width:92px;height:44px;border-radius:46px 46px 8px 8px;background:linear-gradient(180deg,#1E1E1E,#0E0E0E);box-shadow:inset 0 -2px 0 #333}
.lamp .bulb{position:absolute;left:-14px;top:154px;width:28px;height:15px;border-radius:0 0 14px 14px;background:var(--lamp);box-shadow:0 0 36px 10px rgba(255,203,69,.55)}
.lamp .cone{position:absolute;left:-210px;top:160px;width:420px;height:520px;background:linear-gradient(180deg,rgba(255,203,69,.22),rgba(255,203,69,0) 80%);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);pointer-events:none}
@keyframes swing{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
.intro h1{position:relative;font-size:clamp(58px,17vw,128px);margin-top:70px}
.intro h1 em{font-style:normal;color:var(--lamp)}
.intro .lead{position:relative;margin-top:22px;color:var(--warm);font-size:clamp(17px,2.4vw,20px);max-width:32em}
.facts{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:30px}
.fact{padding:14px;border-radius:18px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line)}
.fact b{display:block;font-stretch:62%;font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.fact span{display:block;margin-top:6px;color:var(--mute);font-size:13px;line-height:1.3}
.trust{position:relative;display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:24px;color:var(--mute);font-size:14px}
.trust span{display:inline-flex;align-items:center;gap:8px}
.trust span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--lamp)}
.resume{position:relative;margin-top:26px;padding:16px 18px;border-radius:18px;box-shadow:inset 0 0 0 1px rgba(255,203,69,.45);background:rgba(255,203,69,.06);color:var(--warm);font-size:15px}
.resume b{color:var(--white)}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 26px;border-radius:999px;font:inherit;font-size:16px;font-weight:650;text-decoration:none;cursor:pointer;border:0;transition:transform .2s var(--ease),background-color .2s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn-lamp{background:var(--lamp);color:#000}
.btn-line{background:transparent;color:var(--white);box-shadow:inset 0 0 0 1px var(--line2)}
.btn-wa{background:var(--wa);color:#fff}
.btn svg{flex:0 0 auto}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.row .btn{flex:1 1 200px}

/* steps */
.step-head{padding-top:18px}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--lamp)}
.eyebrow .t{color:var(--mute)}
.step-head h2{font-size:clamp(48px,13vw,96px);margin-top:12px}
.why{display:flex;gap:12px;margin-top:20px;padding:14px 16px;border-radius:16px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);color:var(--warm);font-size:15px}
.why svg{flex:0 0 auto;color:var(--lamp);margin-top:2px}
.fields{display:flex;flex-direction:column;gap:26px;margin-top:30px}
.f{display:flex;flex-direction:column;gap:8px;min-width:0}
.f > label,.f > .lbl{font-weight:650;font-size:16px;line-height:1.35}
.f .req{color:var(--lamp)}
.f .hint{color:var(--mute);font-size:14px;margin-top:-4px}
.inp{width:100%;min-height:56px;border-radius:14px;border:1px solid var(--line2);padding:0 16px;font:inherit;font-size:17px;background:var(--s1);color:var(--white);transition:border-color .2s,box-shadow .2s}
textarea.inp{min-height:110px;padding:14px 16px;resize:vertical;line-height:1.5}
.inp::placeholder{color:#6F6B63}
.inp:focus{outline:none;border-color:var(--lamp);box-shadow:0 0 0 4px rgba(255,203,69,.14)}
.inp[aria-invalid="true"]{border-color:var(--err)}
.err{color:var(--err);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line2);color:var(--warm);cursor:pointer;font-size:15px;transition:background-color .2s,color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:checked){background:var(--lamp);color:#000;box-shadow:none;font-weight:650}
.chip:has(input:focus-visible){outline:2px solid var(--lamp);outline-offset:3px}
.colors{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.cw{position:relative;display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line2);font-size:14px;color:var(--warm);font-variant-numeric:tabular-nums;cursor:pointer}
.cw input{width:36px;height:36px;border:0;padding:0;border-radius:50%;background:none;cursor:pointer}
.cw input::-webkit-color-swatch-wrapper{padding:0}
.cw input::-webkit-color-swatch{border:0;border-radius:50%}
.cw input::-moz-color-swatch{border:0;border-radius:50%}
.ns{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;min-height:40px;padding:0 14px 0 10px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line2);color:var(--mute);font-size:14px;cursor:pointer;transition:background-color .2s,color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
.ns input{position:absolute;opacity:0;pointer-events:none}
.ns i{position:relative;width:18px;height:18px;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--line2);transition:background-color .2s,box-shadow .2s}
.ns i::after{content:"";position:absolute;left:5px;top:2px;width:5px;height:9px;border:solid #000;border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);transition:transform .25s var(--ease)}
.ns:has(input:checked){color:var(--white);box-shadow:inset 0 0 0 1px rgba(255,203,69,.6);background:rgba(255,203,69,.08)}
.ns:has(input:checked) i{background:var(--lamp);box-shadow:none}
.ns:has(input:checked) i::after{transform:rotate(45deg) scale(1)}
.ns:has(input:focus-visible){outline:2px solid var(--lamp);outline-offset:3px}
.f.unsure .inp{opacity:.4}
.ns-ok{display:none;color:var(--lamp);font-size:14px}
.f.unsure .ns-ok{display:block}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(255,122,107,.07);box-shadow:inset 0 0 0 1px rgba(255,122,107,.35);color:var(--warm);font-size:14px}
.note b{color:var(--white)}


/* guide */
.gwrap{display:flex;flex-direction:column;gap:8px}
.gbtn{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 2px;border:0;background:none;color:var(--lamp);font:inherit;font-size:14px;font-weight:650;cursor:pointer;-webkit-tap-highlight-color:transparent}
.gbtn svg{transition:transform .4s var(--ease)}
.gbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.gp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.gp.open{grid-template-rows:1fr}
.gp-in{min-height:0;overflow:hidden}
.gp-box{display:flex;flex-direction:column;gap:14px;margin:4px 0 6px;padding:16px;border-radius:16px;background:#0B0A07;box-shadow:inset 0 0 0 1px rgba(255,203,69,.28)}
.gp-k{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.gp ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.gp li{position:relative;padding-left:16px;color:var(--warm);font-size:15px;line-height:1.45}
.gp li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--lamp)}
.gp .fx{margin-top:6px;padding:10px 12px;border-radius:10px;background:var(--s2);font-size:15px;color:var(--white)}
.gp .ex{margin-top:6px;padding-left:12px;border-left:2px solid var(--lamp);color:var(--white);font-size:15px;font-style:italic}
.gp .sts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gp .st{min-height:36px;padding:0 12px;border-radius:999px;border:0;background:var(--s2);box-shadow:inset 0 0 0 1px var(--line2);color:var(--white);font:inherit;font-size:14px;cursor:pointer;transition:background-color .2s,transform .2s var(--ease)}
.gp .st:active{transform:scale(.95)}
.gp .st::before{content:"+ ";color:var(--lamp)}
.gp .use{align-self:flex-start;min-height:40px;padding:0 16px;border-radius:999px;border:0;background:rgba(255,203,69,.14);color:var(--lamp);font:inherit;font-size:14px;font-weight:650;cursor:pointer}
/* review */
.rv{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.rv-b{border-radius:20px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.rv-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;background:var(--s2)}
.rv-h b{font-size:15px}
.rv-h button{font:inherit;font-size:14px;font-weight:650;color:var(--lamp);background:none;border:0;cursor:pointer;padding:6px 4px;min-height:36px}
.rv-b dl{margin:0;padding:6px 16px 14px}
.rv-b dt{margin-top:10px;color:var(--mute);font-size:13px}
.rv-b dd{margin:2px 0 0;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.rv-b dd.empty{color:#5E5A53;font-style:italic}
.consent{display:flex;gap:12px;align-items:flex-start;margin-top:22px;font-size:15px;color:var(--warm);cursor:pointer}
.consent input{flex:0 0 auto;width:22px;height:22px;margin-top:2px;accent-color:var(--lamp)}
.mailrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px;color:var(--mute);font-size:14px}
.mailrow code{font-family:inherit;color:var(--white);user-select:all;-webkit-user-select:all}

/* done */
.done{text-align:center;padding-top:30px}
.done .ic{display:grid;place-items:center;width:84px;height:84px;margin:0 auto;border-radius:50%;background:var(--lamp);box-shadow:0 0 0 12px rgba(255,203,69,.12),0 0 60px 8px rgba(255,203,69,.5)}
.done h2{font-size:clamp(52px,14vw,100px);margin-top:26px}
.done p{margin:16px auto 0;color:var(--warm);max-width:30em}
.next{list-style:none;padding:0;margin:30px 0 0;text-align:left;display:flex;flex-direction:column;gap:10px}
.next li{display:flex;gap:14px;padding:16px;border-radius:18px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line)}
.next b.n{flex:0 0 auto;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--lamp);color:var(--lamp);font-stretch:62%;font-size:19px}
.next strong{display:block}
.next span{display:block;color:var(--mute);font-size:15px}

.foot{margin-top:56px;padding-top:22px;border-top:1px solid var(--line);color:var(--mute);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
.saved{display:inline-flex;align-items:center;gap:8px}
.saved::before{content:"";width:7px;height:7px;border-radius:50%;background:#46E08A}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(100% + 40px));opacity:0;z-index:95;padding:12px 18px;border-radius:999px;background:var(--white);color:#000;font-weight:650;font-size:14px;transition:transform .5s var(--ease),opacity .3s;pointer-events:none;width:max-content;max-width:calc(100vw - 32px);text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){.lamp,.cap::before{animation:none}.track b,.track i{transition:none}}

  function toast(t) { var el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('show'); }, 2200); }

  function progress() {
    var p = step === 0 ? 0 : Math.min(1, step / (NB + 1));
    $('#tb').style.transform = 'scaleX(' + p.toFixed(3) + ')';
    var tr = $('.track'); $('#td').style.transform = 'translateX(' + (p * tr.offsetWidth).toFixed(1) + 'px)';
    $('#capn').textContent = step === 0 ? 'Início' : step <= NB ? 'Bloco ' + step + ' de ' + NB : step === NB + 1 ? 'Revisão' : 'Pronto';
  }

  /* ---------- views ---------- */
  function vIntro() {
    var mins = BLOCKS.reduce(function (a, b) { return a + b.min; }, 0);
    var h = '<section class="intro"><div class="lamp" aria-hidden="true"><span class="cone"></span><span class="cord"></span><span class="shade"></span><span class="bulb"></span></div>' +
      '<span class="wide" style="position:relative;color:var(--lamp)">Briefing da sua página' + (A.pedido ? ' · Pedido ' + esc(A.pedido) : '') + (A._plano ? ' · ' + esc(A._plano) : '') + '</span>' +
      '<h1 class="cond">Sua página <em>começa aqui.</em></h1>' +
      '<p class="lead">Obrigado pela confiança. Estas respostas guiam cada decisão da sua landing page: textos, visual, integrações e ordem das seções. Quanto mais detalhe, mais a página fala a língua do seu cliente. Não sabe alguma resposta? Marque <b style="color:var(--white)">Não sei responder agora</b> e a gente resolve junto.</p>' +
      '<div class="facts"><div class="fact"><b>' + NB + '</b><span>blocos curtos</span></div><div class="fact"><b>' + mins + '</b><span>minutos, em média</span></div><div class="fact"><b>' + countReq() + '</b><span>respostas obrigatórias</span></div></div>' +
      (saved ? '<div class="resume">Você já começou este briefing neste aparelho. <b>As respostas foram guardadas</b> e você continua de onde parou.</div>' : '') +
      '<div class="row"><button type="button" class="btn btn-lamp" data-go="' + (saved ? Math.max(1, saved) : 1) + '">' + (saved ? 'Continuar o briefing' : 'Começar o briefing') + '</button>' +
      (saved ? '<button type="button" class="btn btn-line" id="restart">Começar do zero</button>' : '') + '</div>' +
      '<div class="trust"><span>Usado só para criar a sua página</span><span>De acordo com a LGPD</span><span>Salvo neste aparelho enquanto você responde</span></div></section>';
    return h;
  }
  function countReq() { var n = 0; BLOCKS.forEach(function (b) { b.f.forEach(function (f) { if (f.req) n++; }); }); return n; }

  function nsBox(f) {
    if (f.noNs) return '';
    var on = !!A['_ns_' + f.id];
    return '<label class="ns"><input type="checkbox" data-ns="' + f.id + '"' + (on ? ' checked' : '') + '><i aria-hidden="true"></i>Não sei responder agora</label><span class="ns-ok">Sem problema. A gente resolve isso junto na imersão.</span>';
  }
  function field(f) {
    var v = A[f.id], id = 'q-' + f.id, req = f.req ? ' <span class="req" aria-hidden="true">*</span>' : '';
    var un = !f.noNs && A['_ns_' + f.id] ? ' unsure' : '';
    var hint = (f.hint ? '<span class="hint">' + esc(f.hint) + '</span>' : '') + guide(f);
    if (f.type === 'note') return '<div class="note"><svg width="18" height="18" aria-hidden="true" style="flex:0 0 auto;margin-top:2px"><use href="#i-lock"/></svg><span>' + f.l + '</span></div>';
    if (f.type === 'one' || f.type === 'many') {
      var multi = f.type === 'many', cur = multi ? (v || []) : v;
      return '<fieldset class="f' + un + '" style="border:0;margin:0;padding:0" id="' + id + '"' + (f.max ? ' data-max="' + f.max + '"' : '') + '>' + (f.l ? '<legend class="lbl" style="padding:0;margin-bottom:8px">' + esc(f.l) + req + '</legend>' : '') + hint +
        '<div class="chips">' + f.o.map(function (o, i) {
          var on = multi ? cur.indexOf(o) > -1 : cur === o;
          return '<label class="chip"><input type="' + (multi ? 'checkbox' : 'radio') + '" name="' + f.id + '" value="' + esc(o) + '"' + (on ? ' checked' : '') + '>' + esc(o) + '</label>';
        }).join('') + '</div>' + nsBox(f) + '<span class="err" id="e-' + f.id + '" hidden>Escolha uma opção ou marque que não sabe.</span></fieldset>';
    }
    if (f.type === 'colors') {
      var c = A.cores || ['#FFCB45', '#0B0B0B', '#F4F2EC'];
      return '<div class="f"><span class="lbl">' + esc(f.l) + '</span>' + hint + '<div class="colors">' + [0, 1, 2].map(function (k) {
        return '<label class="cw" for="q-cor' + k + '"><input type="color" id="q-cor' + k + '" data-cor="' + k + '" value="' + esc(c[k]) + '"><span>' + ['Principal', 'Apoio', 'Fundo'][k] + ' <span id="hx' + k + '">' + esc(c[k].toUpperCase()) + '</span></span></label>';
      }).join('') + '</div></div>';
    }
    var common = ' id="' + id + '" name="' + f.id + '" class="inp"' + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : '') + (f.ac ? ' autocomplete="' + f.ac + '"' : '') + (f.req ? ' aria-required="true"' : '');
    var input = f.type === 'area' ? '<textarea' + common + '>' + esc(v || '') + '</textarea>'
      : '<input' + common + ' type="' + f.type + '"' + (f.type === 'tel' ? ' inputmode="tel"' : f.type === 'email' ? ' inputmode="email"' : '') + ' value="' + esc(v || '') + '">';
    return '<div class="f' + un + '"><label for="' + id + '">' + esc(f.l) + req + '</label>' + hint + input + nsBox(f) + '<span class="err" id="e-' + f.id + '" hidden>' + (f.type === 'tel' ? 'Inclua o DDD e o número completo.' : f.type === 'email' ? 'Confira o e-mail.' : 'Preencha para continuar.') + '</span></div>';
  }

  function vBlock(n) {
    var b = BLOCKS[n - 1];
    return '<section><div class="step-head"><div class="eyebrow wide"><span>Bloco ' + n + ' de ' + NB + '</span><span class="t">Cerca de ' + b.min + ' min</span></div>' +
      '<h2 class="cond">' + esc(b.t) + '</h2>' +
      '<div class="why"><svg width="20" height="20" aria-hidden="true"><use href="#i-bulb"/></svg><span>' + esc(b.why) + '</span></div></div>' +
      '<form class="fields" id="form" novalidate>' + b.f.map(field).join('') +
      '<div class="row" style="margin-top:8px"><button type="submit" class="btn btn-lamp">' + (n === NB ? 'Revisar respostas' : 'Continuar') + '</button>' +
      '<button type="button" class="btn btn-line" data-go="' + (n - 1) + '">Voltar</button></div></form></section>';
  }

  function val(f) {
    var v = A[f.id];
    if (A['_ns_' + f.id] && !(Array.isArray(A[f.id]) ? A[f.id].length : (A[f.id] || '').trim())) return 'Não sei, ver na imersão';
    if (f.type === 'colors') return A.semcor && A.semcor.length ? '' : (A.cores || []).map(function (c) { return c.toUpperCase(); }).join(', ');
    if (Array.isArray(v)) return v.join(', ');
    return (v || '').trim();
  }
  function vReview() {
    var h = '<section><div class="step-head"><div class="eyebrow wide"><span>Último passo</span></div><h2 class="cond">Confira e envie</h2>' +
      '<div class="why"><svg width="20" height="20" aria-hidden="true"><use href="#i-bulb"/></svg><span>Dá para mudar qualquer resposta tocando em Editar. Depois de enviar, as respostas chegam direto no WhatsApp da Maltaark.</span></div></div><div class="rv">';
    BLOCKS.forEach(function (b, i) {
      h += '<div class="rv-b"><div class="rv-h"><b>' + (i + 1) + '. ' + esc(b.t) + '</b><button type="button" data-go="' + (i + 1) + '">Editar</button></div><dl>';
      b.f.forEach(function (f) { if (f.type === 'note' || f.id === 'semcor') return; var v = val(f); h += '<dt>' + esc(f.l) + '</dt><dd' + (v ? '' : ' class="empty"') + '>' + esc(v || 'Sem resposta') + '</dd>'; });
      h += '</dl></div>';
    });
    h += '</div><label class="consent" for="lgpd"><input type="checkbox" id="lgpd"' + (A._lgpd ? ' checked' : '') + '><span>Autorizo a Maltaark Company a usar estas respostas apenas para criar a minha página, conforme a LGPD.</span></label><span class="err" id="e-lgpd" hidden>Marque a autorização para enviar.</span>' +
      '<div class="row"><a class="btn btn-wa" id="send" href="#" target="_blank" rel="noopener"><svg width="20" height="20" aria-hidden="true"><use href="#i-chat"/></svg>Enviar pelo WhatsApp</a>' +
      '<button type="button" class="btn btn-line" id="copy"><svg width="18" height="18" aria-hidden="true"><use href="#i-copy"/></svg>Copiar respostas</button></div>' +
      '<div class="mailrow">Prefere e-mail? Copie as respostas e envie para <code>' + esc(CONFIG.email) + '</code></div>' +
      '<div class="row" style="margin-top:14px"><button type="button" class="btn btn-line" data-go="' + NB + '">Voltar</button></div></section>';
    return h;
  }
  function vDone() {
    var first = (A.nome || '').trim().split(/\s+/)[0];
    return '<section class="done"><div class="ic" aria-hidden="true"><svg width="40" height="40" style="color:#000"><use href="#i-check"/></svg></div>' +
      '<h2 class="cond">Briefing pronto' + (first ? ', ' + esc(first) : '') + '.</h2>' +
      '<p>O WhatsApp abriu com as suas respostas. Confira se a mensagem foi enviada. Se não abriu, toque em Copiar respostas e cole na conversa.</p>' +
      '<ol class="next">' +
      '<li><b class="n">1</b><span><strong>Leitura do briefing</strong><span>A Maltaark lê tudo e prepara as perguntas da imersão.</span></span></li>' +
      '<li><b class="n">2</b><span><strong>Imersão de 45 minutos</strong><span>Marcada no horário que você indicou, por chamada de vídeo.</span></span></li>' +
      '<li><b class="n">3</b><span><strong>Estrutura e textos</strong><span>Você recebe a ordem das seções e os textos para aprovar antes do design.</span></span></li>' +
      '</ol><div class="row"><a class="btn btn-wa" id="send2" href="#" target="_blank" rel="noopener"><svg width="20" height="20" aria-hidden="true"><use href="#i-chat"/></svg>Abrir o WhatsApp de novo</a>' +
      '<button type="button" class="btn btn-line" id="copy2"><svg width="18" height="18" aria-hidden="true"><use href="#i-copy"/></svg>Copiar respostas</button></div>' +
      '<div class="row" style="margin-top:10px"><button type="button" class="btn btn-line" data-go="' + (NB + 1) + '">Rever as respostas</button></div></section>';
  }

  function summary() {
    var out = ['*Briefing Maltaark*' + (A.negocio ? ' | ' + A.negocio.trim() : '') + (A.pedido ? ' | Pedido ' + A.pedido.trim() : ''), ''];
    BLOCKS.forEach(function (b, i) {
      out.push('*' + (i + 1) + '. ' + b.t + '*');
      b.f.forEach(function (f) { if (f.type === 'note' || f.id === 'semcor') return; var v = val(f); if (f.id === 'cores' && A.semcor && A.semcor.length) v = 'Ainda não tenho cores definidas'; out.push(f.l + ': ' + (v || '-')); });
      out.push('');
    });
    if (A._plano) out.splice(1, 0, 'Plano: ' + A._plano);
    out.push('Autorizo o uso destas respostas para criar a minha página (LGPD).');
    return out.join('\n');
  }
  var waUrl = function () { return 'https://wa.me/' + CONFIG.whatsapp + '?text=' + encodeURIComponent(summary()); };
  function copyAll(btn) {
    var t = summary(), ok = function () { toast('Respostas copiadas'); };
    var fallback = function () {
      var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select(); var done = false; try { done = document.execCommand('copy'); } catch (e) {} ta.remove();
      toast(done ? 'Respostas copiadas' : 'Não deu para copiar. Use o botão do WhatsApp.');
    };
    try { navigator.clipboard.writeText(t).then(ok, fallback); } catch (e) { fallback(); }
  }

  /* ---------- render ---------- */
  function render(n, dir) {
    var app = $('#app');
    var paint = function () {
      step = n; save();
      app.innerHTML = n === 0 ? vIntro() : n <= NB ? vBlock(n) : n === NB + 1 ? vReview() : vDone();
      bind(); progress();
      window.scrollTo(0, 0);
      if (canAnim) {
        var kids = app.querySelectorAll('.step-head > *, .f, .note, .row, .rv-b, .consent, .intro > *:not(.lamp), .done > *, .next li');
        Array.prototype.forEach.call(kids, function (el, i) {
          el.animate([{ opacity: 0, transform: 'translateY(' + (dir < 0 ? -18 : 22) + 'px)' }, { opacity: 1, transform: 'none' }], { duration: 700, delay: Math.min(i, 10) * 45, easing: ease, fill: 'backwards' });
        });
        if (n === NB + 2) { var ic = $('.done .ic'); ic.animate([{ transform: 'scale(.3)', opacity: 0 }, { transform: 'scale(1.12)', opacity: 1, offset: .6 }, { transform: 'scale(1)' }], { duration: 900, easing: ease }); }
      }
      var h = app.querySelector('h1, h2'); if (h && n !== 0) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
    };
    if (canAnim && app.firstChild) {
      var a = app.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(' + (dir < 0 ? 16 : -16) + 'px)' }], { duration: 220, easing: 'ease-in', fill: 'forwards' });
      a.onfinish = function () { paint(); a.cancel(); };
    } else paint();
  }

  function readForm() {
    var form = $('#form'); if (!form) return;
    $$('input, textarea', form).forEach(function (el) {
      if (el.dataset.cor != null) { A.cores = A.cores || []; A.cores[+el.dataset.cor] = el.value; return; }
      if (el.dataset.ns) { A['_ns_' + el.dataset.ns] = el.checked; return; }
      if (el.type === 'checkbox') A[el.name] = $$('input[name="' + el.name + '"]:checked', form).map(function (x) { return x.value; });
      else if (el.type === 'radio') { if (el.checked) A[el.name] = el.value; }
      else A[el.name] = el.value;
    });
  }
  function validate(n) {
    var b = BLOCKS[n - 1], first = null;
    b.f.forEach(function (f) {
      var e = $('#e-' + f.id); if (!e) return;
      var v = A[f.id], bad = false;
      if (f.req && !A['_ns_' + f.id]) bad = Array.isArray(v) ? !v.length : !(v || '').trim();
      if (!bad && f.type === 'tel' && (v || '').trim()) bad = (v || '').replace(/\D/g, '').length < 10;
      if (!bad && f.type === 'email' && (v || '').trim()) bad = !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim());
      e.hidden = !bad;
      var el = $('#q-' + f.id); if (el && el.classList.contains('inp')) el.setAttribute('aria-invalid', bad ? 'true' : 'false');
      if (bad && !first) first = $('#q-' + f.id);
    });
    if (first) { first.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' }); var fi = first.querySelector ? (first.querySelector('input') || first) : first; setTimeout(function () { fi.focus({ preventScroll: true }); }, 350); }
    return !first;
  }

  function bind() {
    $$('[data-go]').forEach(function (b) { b.addEventListener('click', function () { readForm(); var to = +b.getAttribute('data-go'); render(to, to < step ? -1 : 1); }); });
    var rs = $('#restart'); if (rs) rs.addEventListener('click', function () { A = { cores: ['#FFCB45', '#0B0B0B', '#F4F2EC'] }; saved = false; try { localStorage.removeItem(KEY); } catch (e) {} render(1, 1); });
    var form = $('#form');
    if (form) {
      form.addEventListener('click', function (e) {
        var gb = e.target.closest('.gbtn');
        if (gb) { var p = $('#g-' + gb.dataset.g), o = gb.getAttribute('aria-expanded') !== 'true'; gb.setAttribute('aria-expanded', o); p.classList.toggle('open', o); if (o) p.removeAttribute('inert'); else p.setAttribute('inert', ''); return; }
        var st = e.target.closest('.st'), us = e.target.closest('.use');
        if (st || us) {
          var inp = $('#q-' + (st ? st.dataset.for : us.dataset.use)); if (!inp) return;
          if (st) { var t = st.dataset.st, v = inp.value; inp.value = v + (v && !/\s$/.test(v) && !/^\s/.test(t) ? ' ' : '') + t; }
          else inp.value = inp.value.trim() ? inp.value.trim() + '\n' + us.dataset.ex : us.dataset.ex;
          inp.dispatchEvent(new Event('input', { bubbles: true }));
          inp.focus({ preventScroll: true }); try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (x) {}
          if (canAnim) inp.animate([{ boxShadow: '0 0 0 4px rgba(255,203,69,.35)' }, { boxShadow: '0 0 0 4px rgba(255,203,69,0)' }], { duration: 700, easing: 'ease-out' });
          if (us) toast('Exemplo colado. Agora ajuste para o seu negócio');
        }
      });
      form.addEventListener('input', function (e) {
        var el = e.target;
        if (el.dataset.cor != null) { $('#hx' + el.dataset.cor).textContent = el.value.toUpperCase(); }
        if (el.name === 'whats' || el.type === 'tel') {
          var d = el.value.replace(/\D/g, '').slice(0, 11), o = d;
          if (d.length > 2) o = '(' + d.slice(0, 2) + ') ' + d.slice(2);
          if (d.length > 6) o = '(' + d.slice(0, 2) + ') ' + (d.length > 10 ? d.slice(2, 7) + '-' + d.slice(7) : d.slice(2, 6) + '-' + d.slice(6));
          el.value = o;
        }
        if (el.classList.contains('inp')) { var box = el.closest('.f'), nb = box && box.querySelector('[data-ns]'); if (nb && nb.checked && el.value.trim()) { nb.checked = false; box.classList.remove('unsure'); } }
        readForm(); save(); flash();
      });
      form.addEventListener('change', function (e) {
        if (e.target.name === 'segmento') {
          A.segmento = e.target.value;
          $$('[data-gw]', form).forEach(function (w) {
            var id = w.dataset.gw; if (!GUIDE[id] || !GUIDE[id].seg) return;
            var open = w.querySelector('.gbtn').getAttribute('aria-expanded') === 'true', fo = null;
            BLOCKS.forEach(function (b) { b.f.forEach(function (x) { if (x.id === id) fo = x; }); });
            var tmp = document.createElement('div'); tmp.innerHTML = guide(fo); var nw = tmp.firstChild; w.replaceWith(nw);
            if (open) { nw.querySelector('.gbtn').setAttribute('aria-expanded', 'true'); var gp = nw.querySelector('.gp'); gp.classList.add('open'); gp.removeAttribute('inert'); }
          });
        }
        if (e.target.dataset.ns) {
          var bx = e.target.closest('.f'); bx.classList.toggle('unsure', e.target.checked);
          var er0 = $('#e-' + e.target.dataset.ns); if (er0) er0.hidden = true;
          if (e.target.checked) { $$('.chips input', bx).forEach(function (x) { x.checked = false; }); var ip = bx.querySelector('.inp'); if (ip) ip.setAttribute('aria-invalid', 'false'); }
          if (canAnim) { var ok = bx.querySelector('.ns-ok'); if (e.target.checked && ok) ok.animate([{ opacity: 0, transform: 'translateY(-6px)' }, { opacity: 1, transform: 'none' }], { duration: 450, easing: ease }); }
        }
        if ((e.target.type === 'radio' || (e.target.type === 'checkbox' && !e.target.dataset.ns)) && e.target.checked) { var b2 = e.target.closest('.f'), n2 = b2 && b2.querySelector('[data-ns]'); if (n2 && n2.checked) { n2.checked = false; b2.classList.remove('unsure'); } }
        var fs = e.target.closest('fieldset[data-max]');
        if (fs && e.target.checked) { var on = $$('input:checked', fs); if (on.length > +fs.dataset.max) { e.target.checked = false; toast('Escolha no máximo ' + fs.dataset.max); } }
        if (e.target.type === 'checkbox' || e.target.type === 'radio') { var er = $('#e-' + e.target.name); if (er) er.hidden = true; }
        readForm(); save(); flash();
      });
      form.addEventListener('submit', function (e) { e.preventDefault(); readForm(); if (validate(step)) render(step + 1, 1); });
    }
    var send = $('#send');
    if (send) {
      send.href = waUrl();
      $('#lgpd').addEventListener('change', function () { A._lgpd = this.checked; $('#e-lgpd').hidden = true; save(); });
      send.addEventListener('click', function (e) {
        if (!$('#lgpd').checked) { e.preventDefault(); $('#e-lgpd').hidden = false; $('#lgpd').focus(); return; }
        send.href = waUrl(); A._sent = new Date().toISOString(); save();
        if (CONFIG.enviarPorEmail && !/claude\.ai|claudeusercontent/.test(location.hostname)) {
          try { fetch('https://formsubmit.co/ajax/' + CONFIG.email, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify({ _subject: 'Briefing: ' + (A.negocio || A.nome || 'novo cliente') + (A.pedido ? ' (' + A.pedido + ')' : ''), briefing: summary(), _template: 'box' }) }).catch(function () {}); } catch (x) {}
        }
        setTimeout(function () { render(NB + 2, 1); }, 400);
      });
      $('#copy').addEventListener('click', function () { copyAll(this); });
    }
    var s2 = $('#send2'); if (s2) { s2.href = waUrl(); $('#copy2').addEventListener('click', function () { copyAll(this); }); }
  }
  var flashT = null;
  function flash() { var n = $('#capn'); if (!n || step < 1 || step > NB) return; n.textContent = 'Salvo'; clearTimeout(flashT); flashT = setTimeout(progress, 900); }

  window.addEventListener('resize', progress);
  render(0, 1);
})();
</script>

</body>
</html>
